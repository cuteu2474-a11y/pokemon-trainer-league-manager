<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trainer League — Club Management</title>
<style>
:root{--bg:#101923;--side:#101e2a;--panel:#172633;--panel2:#1b2d3a;--line:#2c3d49;--ink:#e8eef0;--muted:#8c9ca7;--accent:#e5ae53;--green:#71bba3;--red:#d67d7c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.48 "Segoe UI",Arial,"Apple SD Gothic Neo",sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--side);border-right:1px solid #334451;display:flex;flex-direction:column}.brand{height:74px;padding:19px 19px 12px;border-bottom:1px solid var(--line)}.brand strong{display:block;font-size:17px;letter-spacing:.08em}.brand small{color:var(--accent);font-size:10px;letter-spacing:.2em;font-weight:700}.club-identity{padding:21px 18px;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:center}.crest{width:39px;height:44px;clip-path:polygon(50% 0,100% 15%,100% 70%,50% 100%,0 70%,0 15%);background:#d1a35c;color:#1a2730;display:grid;place-items:center;font-weight:900;font-size:17px}.club-identity strong{font-size:13px}.club-identity span{display:block;font-size:11px;color:var(--muted)}.nav-heading{font-size:10px;color:#738999;letter-spacing:.15em;padding:20px 18px 7px;font-weight:700}.nav-item{width:100%;background:transparent;color:#b6c5cd;border:0;border-left:3px solid transparent;text-align:left;padding:11px 18px;display:flex;gap:12px;align-items:center}.nav-item:hover{background:#1d303e}.nav-item.active{background:#203440;color:#fff;border-left-color:var(--accent);font-weight:700}.nav-item .symbol{width:19px;color:#91a6b3;font-size:15px}.sidebar-foot{margin-top:auto;border-top:1px solid var(--line);padding:17px 19px;color:#8499a7;font-size:11px}.main{min-width:0}.topbar{height:57px;background:#1b2b37;border-bottom:1px solid #334451;display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:14px}.breadcrumbs{font-size:11px;color:#9caeba;letter-spacing:.025em}.top-right{display:flex;align-items:center;gap:17px;font-size:11px;color:#a7b8c2}.advance{background:var(--accent);color:#17212a;border:0;border-radius:2px;padding:9px 16px;font-weight:800}.content{padding:29px 34px 55px;max-width:1540px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:end;gap:16px;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:23px}.eyebrow{color:var(--accent);font-weight:700;font-size:10px;letter-spacing:.17em;text-transform:uppercase}.heading h1{font-size:27px;font-weight:650;letter-spacing:-.045em;margin:4px 0 2px}.subtle{color:var(--muted);font-size:12px}.season{font-size:11px;color:#c2d1d8;text-align:right}.season b{display:block;color:var(--ink);font-size:15px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px}.section{background:var(--panel);border:1px solid var(--line);margin-bottom:19px}.section-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);gap:8px}.section-head h2{margin:0;font-size:12px;letter-spacing:.025em}.section-head small{color:var(--muted)}.metric-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:19px}.metric{background:var(--panel);padding:15px 16px}.metric span{font-size:10px;color:#9eb0ba}.metric strong{display:block;font-size:24px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.04em}.metric small{font-size:10px;color:var(--green)}.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);padding:0 15px}.tab{border:0;background:transparent;color:#9cb0bc;padding:12px 15px;border-bottom:2px solid transparent}.tab.active{color:#fff;border-bottom-color:var(--accent);font-weight:700}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px}th{font-size:10px;letter-spacing:.035em;color:#a1b1bb;text-align:left;background:#20313e;padding:10px 11px;font-weight:600;white-space:nowrap}td{padding:11px;border-top:1px solid #2b3b46;white-space:nowrap}tbody tr{cursor:pointer}tbody tr:hover{background:#263946}tbody tr.selected{background:#2c4050}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.name{font-weight:700}.name small{display:block;color:#95a8b5;font-weight:400}.role{font-size:10px;color:#a5b6c0}.rating{display:inline-block;min-width:22px;text-align:right;font-weight:800}.rating.high{color:#80d5af}.rating.mid{color:#edc27a}.rating.low{color:#9eb0ba}.pill{border:1px solid #446453;color:#94c9a9;padding:2px 7px;font-size:10px}.muted{color:var(--muted)}.detail{padding:18px}.portrait{height:112px;background:linear-gradient(135deg,#2a4352,#1b2c38);border:1px solid #3b5160;display:flex;align-items:center;justify-content:center;margin-bottom:14px;position:relative}.portrait span{font-size:49px;font-weight:300;color:#8ba4b2}.portrait small{position:absolute;bottom:8px;right:10px;font-size:9px;color:#9eb1bc;letter-spacing:.08em}.detail h3{font-size:20px;margin:0;font-weight:650}.detail .position{color:var(--accent);font-size:11px;margin:3px 0 17px}.details-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;border-top:1px solid var(--line);padding-top:15px}.details-grid label{display:block;color:#91a5b1;font-size:10px}.details-grid strong{font-size:13px}.attribute{display:grid;grid-template-columns:1fr 25px;gap:7px;margin:9px 0;align-items:center;font-size:11px}.attribute strong{text-align:right;color:#91d0ad}.attribute-bar{grid-column:1/-1;height:4px;background:#344854}.attribute-bar i{display:block;height:4px;background:#7ebba0}.detail-heading{font-size:10px;letter-spacing:.13em;color:#a3b5bf;margin:23px 0 12px;font-weight:700}.next-match{padding:20px 17px}.fixture-line{display:flex;align-items:center;justify-content:space-between;gap:8px}.fixture-club{width:38%;text-align:center;font-size:12px;font-weight:700}.fixture-club .badgecrest{display:grid;place-items:center;width:40px;height:40px;border:1px solid #60727d;margin:0 auto 8px;font-size:16px;color:#e5ae53}.versus{font-size:11px;color:#879aa5}.match-meta{text-align:center;color:#9dafb9;font-size:10px;margin-top:17px}.action-row{display:flex;gap:7px;margin-top:17px}.action{border:1px solid #5b7180;color:#e3e9eb;background:#253b49;padding:8px 10px;flex:1}.action:hover{background:#324b5c}.compact td{padding:9px 11px}.rank-up{border-left:3px solid var(--green)}.rank-down{border-left:3px solid var(--red)}.empty{padding:25px;color:var(--muted)}.footnote{font-size:11px;color:#8ea2af;margin-top:12px}.toolbar{display:flex;gap:9px;align-items:center}.toolbar select{background:#223542;color:#d9e4e9;border:1px solid #456071;padding:7px;font:inherit}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:19px}.formline{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}.formline strong{font-size:12px}.formline small{color:var(--muted)}.notice{border-left:3px solid var(--accent);padding:12px 14px;background:#273744;font-size:11px;color:#cad7de;margin-bottom:18px}.hidden{display:none}@media(max-width:1050px){.layout{grid-template-columns:1fr}.right-column{display:grid;grid-template-columns:1fr 1fr;gap:18px}.right-column .section{margin-bottom:0}}@media(max-width:740px){.app{grid-template-columns:61px minmax(0,1fr)}.brand{padding:19px 8px}.brand strong{font-size:12px}.brand small,.club-identity,.nav-heading,.nav-item .nav-label,.sidebar-foot{display:none}.nav-item{justify-content:center;padding:14px 0}.nav-item .symbol{font-size:20px}.content{padding:20px 14px}.topbar{padding:0 14px}.top-right span{display:none}.metric-row{grid-template-columns:repeat(2,1fr)}.right-column,.two-col{grid-template-columns:1fr}.heading h1{font-size:22px}}
</style></head><body><div class="app">
<aside class="sidebar"><div class="brand"><strong>TRAINER LEAGUE</strong><small>CLUB MANAGEMENT</small></div><div class="club-identity"><div class="crest">L</div><div><strong>미르시티 FC</strong><span>칼로스 · 1부 리그</span></div></div><div class="nav-heading">구단 운영</div>
<nav id="navigation"><button class="nav-item active" data-view="home"><span class="symbol">▦</span><span class="nav-label">홈</span></button><button class="nav-item" data-view="squad"><span class="symbol">♙</span><span class="nav-label">트레이너</span></button><button class="nav-item" data-view="tactics"><span class="symbol">◇</span><span class="nav-label">전술 및 출전 순서</span></button><button class="nav-item" data-view="pokemon"><span class="symbol">◈</span><span class="nav-label">포켓몬</span></button><div class="nav-heading">대회 및 구단</div><button class="nav-item" data-view="league"><span class="symbol">▤</span><span class="nav-label">리그</span></button><button class="nav-item" data-view="fixtures"><span class="symbol">▣</span><span class="nav-label">일정 및 결과</span></button><button class="nav-item" data-view="scouting"><span class="symbol">⌕</span><span class="nav-label">스카우팅</span></button><button class="nav-item" data-view="finances"><span class="symbol">₽</span><span class="nav-label">재정</span></button></nav><div class="sidebar-foot">시즌 2026 / 27<br>인터페이스 프로토타입</div></aside>
<main class="main"><header class="topbar"><div class="breadcrumbs" id="breadcrumb">구단 / 홈</div><div class="top-right"><span>2026년 8월 1일 · 토요일</span><button class="advance" id="advance">계속 진행 ▸</button></div></header>
<div class="content"><div class="heading"><div><div class="eyebrow" id="eyebrow">Club overview</div><h1 id="page-title">구단 개요</h1><div class="subtle" id="page-subtitle">미르시티 FC · 칼로스 지방</div></div><div class="season"><span>2026 / 27 시즌</span><b>1부 리그</b></div></div><div id="notification" class="notice hidden"></div><div id="view"></div></div></main></div>
<script>
const trainers=[
{name:'시트론',english:'Clemont',role:'주장 · 체육관 관장',tactics:17,switching:16,scouting:13,training:14,capture:12,appraisal:15,age:22,origin:'미르시티',pokemon:['일레도리자드','파이어로','킬가르도','고고트','드래캄','음번']},
{name:'미르시티 트레이너 2',english:'Lumiose Trainer 2',role:'에이스',tactics:15,switching:14,scouting:12,training:12,capture:13,appraisal:14,age:28,origin:'미르시티',pokemon:['개굴닌자','루차불','일레도리자드','아마루르가','대로트','블로스터']},
{name:'미르시티 트레이너 3',english:'Lumiose Trainer 3',role:'전략가',tactics:18,switching:15,scouting:16,training:14,capture:11,appraisal:15,age:31,origin:'미르시티',pokemon:['킬가르도','고고트','음번','파이어로','드래캄','개굴닌자']},
{name:'미르시티 트레이너 4',english:'Lumiose Trainer 4',role:'전문가',tactics:13,switching:17,scouting:12,training:13,capture:17,appraisal:12,age:26,origin:'미르시티',pokemon:['루차불','대로트','블로스터','아마루르가','고고트','파이어로']},
{name:'미르시티 트레이너 5',english:'Lumiose Trainer 5',role:'유망주',tactics:12,switching:13,scouting:14,training:18,capture:13,appraisal:11,age:19,origin:'미르시티',pokemon:['드래캄','음번','개굴닌자','킬가르도','루차불','아마루르가']}
];
const divisionNames=['구름시티','미르시티','슛시티','테이블시티','해안시티','노랑시티','금빛시티','하우올리시티','축복시티','뇌문시티'];
const stats=['tactics','switching','scouting','training','capture','appraisal'];const labels={tactics:'전술 이해도',switching:'교체 판단',scouting:'탐색',training:'육성',capture:'포획',appraisal:'개체 감별'};
const state={view:'home',selected:0,tab:'all',day:1,order:[0,1,2,3,4],division:1};
const $=id=>document.getElementById(id);const value=n=>'<span class="rating '+(n>=16?'high':n>=12?'mid':'low')+'">'+n+'</span>';
const table=(headers,rows,compact=false)=>'<div class="table-wrap"><table class="'+(compact?'compact':'')+'"><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';
function trainerTable(){return table(['#','트레이너','역할','전술','교체','탐색','육성','포획','감별','포켓몬'],trainers.map((t,i)=>'<tr class="'+(state.selected===i?'selected':'')+'" data-trainer="'+i+'"><td class="muted">'+String(i+1).padStart(2,'0')+'</td><td class="name">'+t.name+'<small>'+t.english+'</small></td><td class="role">'+t.role+'</td>'+stats.map(s=>'<td>'+value(t[s])+'</td>').join('')+'<td>6 / 6</td></tr>'))}
function detail(){const t=trainers[state.selected];return '<div class="section"><div class="section-head"><h2>트레이너 정보</h2><small>프로필</small></div><div class="detail"><div class="portrait"><span>'+t.name.slice(0,1)+'</span><small>NO PHOTO</small></div><h3>'+t.name+'</h3><div class="position">'+t.role+'</div><div class="details-grid"><div><label>나이</label><strong>'+t.age+'세</strong></div><div><label>출신</label><strong>'+t.origin+'</strong></div><div><label>보유 포켓몬</label><strong>6마리</strong></div><div><label>소속</label><strong>미르시티 FC</strong></div></div><div class="detail-heading">능력치 분석</div>'+stats.map(s=>'<div class="attribute"><span>'+labels[s]+'</span><strong>'+t[s]+'</strong><div class="attribute-bar"><i style="width:'+t[s]*5+'%"></i></div></div>').join('')+'<div class="detail-heading">주요 포켓몬</div><div class="subtle">'+t.pokemon.join(' · ')+'</div></div></div>'}
function match(){return '<div class="section"><div class="section-head"><h2>다음 경기</h2><small>1부 리그 · 1R</small></div><div class="next-match"><div class="fixture-line"><div class="fixture-club"><div class="badgecrest">L</div>미르시티</div><span class="versus">VS</span><div class="fixture-club"><div class="badgecrest">C</div>구름시티</div></div><div class="match-meta">홈 경기 · 시즌 개막전<br>5인 연승전 / 6 vs 6</div><div class="action-row"><button class="action" data-go="tactics">출전 명단</button><button class="action" data-go="fixtures">일정 확인</button></div></div></div>'}
function leagueTable(){return table(['순위','구단','경기','승','무','패','승점'],divisionNames.map((n,i)=>'<tr><td class="'+(i<2?'rank-up':i>=8?'rank-down':'')+'">'+(i+1)+'</td><td class="name">'+n+'</td><td class="num">0</td><td class="num">0</td><td class="num">0</td><td class="num">0</td><td class="num">'+(i===1?'<strong>0</strong>':'0')+'</td></tr>'),true)}
function home(){return '<div class="metric-row"><div class="metric"><span>리그 순위</span><strong>— <small>/ 10</small></strong><small>시즌 개막 전</small></div><div class="metric"><span>구단 재정</span><strong>₽12.0M</strong><small>운영 자금</small></div><div class="metric"><span>등록 트레이너</span><strong>5 <small>/ 5</small></strong><small>출전 가능</small></div><div class="metric"><span>등록 포켓몬</span><strong>30 <small>/ 30</small></strong><small>선수단 전체</small></div></div><div class="layout"><div><div class="section"><div class="section-head"><h2>1군 트레이너</h2><small>등록 인원 5명</small></div>'+trainerTable()+'</div><div class="section"><div class="section-head"><h2>1부 리그</h2><button class="action" data-go="league">전체 순위</button></div>'+leagueTable()+'</div></div><div class="right-column">'+match()+detail()+'</div></div>'}
function squad(){return '<div class="layout"><div><div class="section"><div class="section-head"><h2>트레이너 명단</h2><div class="toolbar"><select id="squad-filter"><option value="all">전체 트레이너</option><option value="canonical">대표 트레이너</option><option value="original">구단 소속</option></select></div></div>'+trainerTable()+'</div><div class="footnote">행을 선택하면 우측에 트레이너의 능력치와 보유 포켓몬이 표시됩니다.</div></div><div>'+detail()+'</div></div>'}
function tactics(){return '<div class="layout"><div><div class="section"><div class="section-head"><h2>출전 순서</h2><small>위에서 아래로 출전 · 5명</small></div>'+state.order.map((index,i)=>'<div class="formline"><div><strong>'+String(i+1).padStart(2,'0')+'　'+trainers[index].name+'</strong><br><small>'+trainers[index].role+' · 전술 '+trainers[index].tactics+' · 교체 '+trainers[index].switching+'</small></div><div class="toolbar"><button class="action" data-move="'+i+':-1" '+(i===0?'disabled':'')+'>↑</button><button class="action" data-move="'+i+':1" '+(i===4?'disabled':'')+'>↓</button></div></div>').join('')+'</div><div class="section"><div class="section-head"><h2>전술 지침</h2><small>트레이너 AI 적용 대상</small></div><div class="formline"><span>기술 선택</span><strong>전술 능력치 기반</strong></div><div class="formline"><span>포켓몬 교체</span><strong>교체 판단 능력치 기반</strong></div><div class="formline"><span>전투 방식</span><strong>자동 전투</strong></div><div class="formline"><span>트레이너 탈락</span><strong>다음 순번 출전</strong></div></div></div><div>'+match()+detail()+'</div></div>'}
function pokemon(){const t=trainers[state.selected];return '<div class="layout"><div><div class="section"><div class="section-head"><h2>보유 포켓몬</h2><select id="pokemon-trainer">'+trainers.map((x,i)=>'<option value="'+i+'" '+(i===state.selected?'selected':'')+'>'+x.name+'</option>').join('')+'</select></div>'+table(['슬롯','포켓몬','소속 트레이너','등록','비고'],t.pokemon.map((p,i)=>'<tr><td>'+String(i+1).padStart(2,'0')+'</td><td class="name">'+p+'</td><td>'+t.name+'</td><td><span class="pill">등록</span></td><td class="muted">상세 수치 연동 예정</td></tr>'))+'</div></div><div>'+detail()+'</div></div>'}
function league(){return '<div class="layout"><div><div class="section"><div class="section-head"><h2>리그 순위표</h2><select id="division">'+[1,2,3,4].map(n=>'<option value="'+n+'" '+(state.division===n?'selected':'')+'>'+n+'부 리그</option>').join('')+'</select></div>'+(state.division===1?leagueTable():'<div class="empty">'+state.division+'부 순위 데이터는 실제 경기 엔진 연결 시 표시됩니다.</div>')+'</div><div class="footnote">상위 2구단 승격 / 하위 2구단 강등 · 18라운드 홈 앤드 어웨이</div></div><div>'+match()+'</div></div>'}
function fixtures(){return '<div class="layout"><div><div class="section"><div class="section-head"><h2>경기 일정</h2><small>시즌 2026 / 27</small></div>'+Array.from({length:18},(_,i)=>'<div class="formline"><div><strong>'+String(i+1).padStart(2,'0')+'R　'+(i%2?'원정':'홈')+' · '+divisionNames[(i+2)%10]+'</strong><br><small>1부 리그 · 정규 시즌</small></div><span class="muted">예정</span></div>').join('')+'</div></div><div>'+match()+'</div></div>'}
function scouting(){return '<div class="two-col"><div class="section"><div class="section-head"><h2>지역 탐색</h2><small>스카우팅 업무</small></div><div class="empty">지역별 탐색 대상과 포획 보고서는 실제 탐색 시스템과 연결할 예정입니다.</div></div><div class="section"><div class="section-head"><h2>담당 트레이너</h2></div>'+trainers.map(t=>'<div class="formline"><strong>'+t.name+'</strong><span>탐색 '+value(t.scouting)+' / 감별 '+value(t.appraisal)+'</span></div>').join('')+'</div></div>'}
function finances(){return '<div class="metric-row"><div class="metric"><span>운영 자금</span><strong>₽12.0M</strong><small>도시 규모 지수 100</small></div><div class="metric"><span>팬 규모</span><strong>75,000</strong><small>초기 추정치</small></div><div class="metric"><span>시설 수준</span><strong>20 <small>/ 20</small></strong><small>초기 설정</small></div><div class="metric"><span>구단 규모</span><strong>대도시</strong><small>최상위 규모</small></div></div><div class="section"><div class="section-head"><h2>재정 보고</h2></div><div class="empty">구단 초기 자금은 생성 규칙에 연결된 값입니다. 수입·지출·계약 예산은 재정 엔진 연동 후 표시됩니다.</div></div>'}
const pages={home:['Club overview','구단 개요','미르시티 FC · 칼로스 지방',home],squad:['Squad','트레이너','1군 등록 명단 및 능력치',squad],tactics:['Tactics','전술 및 출전 순서','연승전 출전 순서와 트레이너 AI',tactics],pokemon:['Pokémon','포켓몬','트레이너별 등록 포켓몬',pokemon],league:['Competition','리그','4개 디비전 · 승강급 2구단',league],fixtures:['Fixtures','일정 및 결과','2026 / 27 시즌',fixtures],scouting:['Recruitment','스카우팅','지역 탐색 및 개체 감별',scouting],finances:['Finances','재정','운영 자금 및 시설 현황',finances]};
function render(){const p=pages[state.view];$('eyebrow').textContent=p[0];$('page-title').textContent=p[1];$('page-subtitle').textContent=p[2];$('breadcrumb').textContent='구단 / '+p[1];$('view').innerHTML=p[3]();document.querySelectorAll('[data-view]').forEach(el=>el.classList.toggle('active',el.dataset.view===state.view));}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){state.view=nav.dataset.view;render();return}const go=e.target.closest('[data-go]');if(go){state.view=go.dataset.go;render();return}const tr=e.target.closest('[data-trainer]');if(tr){state.selected=Number(tr.dataset.trainer);render();return}const move=e.target.closest('[data-move]');if(move){const [i,delta]=move.dataset.move.split(':').map(Number),j=i+delta;if(j>=0&&j<5){[state.order[i],state.order[j]]=[state.order[j],state.order[i]];render()}}});
document.addEventListener('change',e=>{if(e.target.id==='pokemon-trainer'){state.selected=Number(e.target.value);render()}if(e.target.id==='division'){state.division=Number(e.target.value);render()}});
$('advance').addEventListener('click',()=>{const n=$('notification');n.classList.remove('hidden');n.textContent='UI 미리보기 모드: 날짜 진행과 실제 경기 결과 반영은 게임 엔진 연결 후 활성화됩니다.';});
render();
</script></body></html>
