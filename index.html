/* Club management shell — deliberate dense game UI, not a dashboard */
:root{--bg:#0d1624;--side:#101b29;--panel:#142130;--panel2:#1a2b3c;--line:#2c3b4b;--ink:#e7eaf0;--muted:#8b9cae;--accent:#d43aa6;--green:#49c1b7;--red:#e35d87}
body{background:radial-gradient(ellipse at 8% 0%,#34203f 0%,#152032 25%,#0d1724 72%);font-family:Arial,"Malgun Gothic",sans-serif}
.app{display:block;min-height:100vh}.sidebar{display:none}.main{width:100%}
.topbar{height:50px;padding:0 25px;background:linear-gradient(110deg,#311c40 0%,#172134 45%,#111a2b 100%);border-bottom:1px solid #344053}
.top-right{gap:20px}.advance{background:#a92d9c;color:#fff;padding:9px 26px;border-radius:2px}
.content{max-width:none;padding:0 30px 40px}.heading{padding:17px 2px 14px;margin:0 0 13px;border-bottom:1px solid #29394c}
.heading h1{font-size:19px;letter-spacing:-.02em;margin:3px 0}.heading .eyebrow{font-size:10px;color:#e85bc4}.season b{font-size:12px}
.game-nav{display:flex;gap:2px;padding:0 19px;background:#111b2a;border-bottom:1px solid #273b4a;overflow-x:auto}
.game-nav button{background:transparent;color:#c0cbd7;border:0;padding:13px 19px;white-space:nowrap;font-size:12px;font-weight:600;border-bottom:3px solid transparent}
.game-nav button.active{color:#fff;border-bottom-color:#51c6be}.game-nav button:hover{background:#263247}
.sub-nav{display:flex;gap:4px;padding:9px 30px 0;overflow-x:auto;background:#142031}
.sub-nav button{border:0;background:transparent;color:#b6c5d1;padding:10px 14px;white-space:nowrap;font-size:12px}
.sub-nav button.active{border:1px solid #c13d9d;color:#fff;border-radius:7px 7px 0 0;background:#211d34}
.workspace-head{display:flex;align-items:center;justify-content:space-between;padding:10px 0 13px;gap:10px}
.workspace-head strong{color:#e96bbf;font-size:13px}.workspace-head .subtle{font-size:11px}
.section{background:#132131;border:1px solid #273a4b}.section-head{background:#172738;padding:11px 14px}
.section-head h2{font-size:12px}.action{border-color:#41556b;background:#1b2b40}.action:hover{background:#283b50}
.pill{border-color:#329c98;color:#71d4cb}.rating.high{color:#5ed8c6}
.tactic-grid{display:grid;grid-template-columns:240px minmax(290px,1fr) minmax(390px,1.22fr);gap:18px;min-height:660px}
.tactic-column{min-width:0}.tactic-label{font-size:12px;font-weight:800;color:#e978c7;margin:0 0 12px}
.plan-list{display:flex;flex-direction:column;gap:4px}.plan-choice{border:0;background:#0b1422;color:#d2d9e3;text-align:left;padding:10px 12px;border-radius:4px;font-size:11px;display:flex;align-items:center;gap:10px}.plan-choice.selected{background:#293c4c}.plan-choice .dot{border:2px solid #5cc6bb;border-radius:50%;width:11px;height:11px;display:inline-block;flex:none}.plan-choice:not(.selected) .dot{border-color:#b54895}
.mentality{margin-top:28px}.mentality label{display:block;font-size:11px;margin:12px 0 5px}.mentality input{width:95%;accent-color:#be369d}
.formation{position:relative;max-width:480px;margin:18px auto 0;height:410px;background:linear-gradient(180deg,#143657,#173958);border:2px solid #3378c4;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);box-shadow:inset 0 0 0 1px #264d81}
.formation:before{content:"";position:absolute;inset:12% 8% 0;border:2px solid #4486cc;clip-path:polygon(15% 0,85% 0,100% 100%,0 100%);opacity:.75}
.field-line{position:absolute;left:0;right:0;top:50%;border-top:2px solid #3478b8}.field-circle{position:absolute;top:44%;left:45%;width:10%;aspect-ratio:1;border:2px solid #4986cb;border-radius:50%}
.field-unit{position:absolute;transform:translate(-50%,-50%);background:#43bf9c;border:3px solid #c7f6e7;width:37px;height:37px;border-radius:50%;display:grid;place-items:center;color:#092a2d;font-weight:800;cursor:pointer;z-index:2}.field-unit.selected{background:#d64bb3;border-color:#ffe1f4;color:#fff;box-shadow:0 0 0 5px #d64bb333}
.field-unit:nth-of-type(1){left:50%;top:13%}.field-unit:nth-of-type(2){left:30%;top:39%}.field-unit:nth-of-type(3){left:70%;top:39%}.field-unit:nth-of-type(4){left:38%;top:75%}.field-unit:nth-of-type(5){left:62%;top:75%}
.formation-caption{text-align:center;margin:15px auto;color:#dc78bf;font-size:12px;font-weight:700}
.formation-help{text-align:center;color:#a2b5c3;font-size:11px;max-width:390px;margin:auto}
.order-row{display:flex;justify-content:center;gap:8px;margin-top:15px}.order-row button{background:#742568;color:white;border:0;padding:9px 24px;border-radius:4px}
.config-tabs{display:flex;gap:4px;margin-bottom:0;padding-left:12px}.config-tabs button{border:1px solid #38536a;background:#111d2d;color:#aebdc9;padding:10px 18px;border-radius:7px 7px 0 0}.config-tabs button.active{color:#6ce2d5;border-color:#54bdb4}
.config-panel{background:#142130;border:1px solid #394b5d;padding:16px 16px 20px;max-height:665px;overflow-y:auto}
.config-group{border-top:1px solid #3eaaa7;margin-top:18px;padding-top:12px}.config-group:first-child{border-top:0;margin-top:0}.config-group h3{font-size:11px;color:#6dd2c9;margin:0 0 14px}
.config-row{display:grid;grid-template-columns:minmax(115px,1fr) minmax(180px,2fr);gap:12px;align-items:center;margin:12px 0;font-size:11px}
.config-options{display:flex;gap:5px}.config-options button{flex:1;min-width:0;background:#08111f;color:#d0d9e4;border:1px solid transparent;border-radius:5px;padding:8px 3px;font-size:11px}.config-options button.active{border-color:#d04aa8;color:#fff;background:#241b35}
.config-options button:disabled{opacity:.48;cursor:not-allowed}
.config-note{font-size:10px;color:#8598a7;margin:7px 0 13px}.plan-flag{color:#6bd0c6;font-size:10px}
.metric-row{background:#26384b}.metric{background:#162538}.metric strong{font-size:21px}
@media(max-width:1130px){.tactic-grid{grid-template-columns:200px minmax(250px,1fr)}.tactic-grid>.tactic-column:last-child{grid-column:1/-1}.config-panel{max-height:none}.content{padding:0 18px 30px}}
@media(max-width:680px){.tactic-grid{display:block}.tactic-column{margin-bottom:24px}.formation{height:340px;max-width:400px}.topbar{padding:0 12px}.game-nav button{padding:12px}.sub-nav{padding-left:10px}.content{padding:0 10px 30px}.heading{padding:12px 0}.config-row{grid-template-columns:1fr}}

.formation-caption{font-size:15px;font-weight:900;letter-spacing:-.04em}

const state={view:'tactics',selected:0,tab:'all',day:1,order:[0,1,2,3,4],division:1,plan:0,switchPref:2};
const $=id=>document.getElementById(id);const value=n=>'<span class="rating '+(n>=16?'high':n>=12?'mid':'low')+'">'+n+'</span>';
const table=(headers,rows,compact=false)=>'<div class="table-wrap"><table class="'+(compact?'compact':'')+'"><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';
function trainerTable(){return table(['#','트레이너','역할','전술','교체','탐색','육성','포획','감별','포켓몬'],trainers.map((t,i)=>'<tr class="'+(state.selected===i?'selected':'')+'" data-trainer="'+i+'"><td class="muted">'+String(i+1).padStart(2,'0')+'</td><td class="name">'+t.name+'<small>'+t.english+'</small></td><td class="role">'+t.role+'</td>'+stats.map(s=>'<td>'+value(t[s])+'</td>').join('')+'<td>6 / 6</td></tr>'))}
function detail(){const t=trainers[state.selected];return '<div class="section"><div class="section-head"><h2>트레이너 정보</h2><small>프로필</small></div><div class="detail"><div class="portrait"><span>'+t.name.slice(0,1)+'</span><small>NO PHOTO</small></div><h3>'+t.name+'</h3><div class="position">'+t.role+'</div><div class="details-grid"><div><label>나이</label><strong>'+t.age+'세</strong></div><div><label>출신</label><strong>'+t.origin+'</strong></div><div><label>보유 포켓몬</label><strong>6마리</strong></div><div><label>소속</label><strong>미르시티 FC</strong></div></div><div class="detail-heading">능력치 분석</div>'+stats.map(s=>'<div class="attribute"><span>'+labels[s]+'</span><strong>'+t[s]+'</strong><div class="attribute-bar"><i style="width:'+t[s]*5+'%"></i></div></div>').join('')+'<div class="detail-heading">주요 포켓몬</div><div class="subtle">'+t.pokemon.join(' · ')+'</div></div></div>'}
function match(){return '<div class="section"><div class="section-head"><h2>다음 경기</h2><small>1부 리그 · 1R</small></div><div class="next-match"><div class="fixture-line"><div class="fixture-club"><div class="badgecrest">L</div>미르시티</div><span class="versus">VS</span><div class="fixture-club"><div class="badgecrest">C</div>구름시티</div></div><div class="match-meta">홈 경기 · 시즌 개막전<br>5인 연승전 / 6 vs 6</div><div class="action-row"><button class="action" data-go="tactics">출전 명단</button><button class="action" data-go="fixtures">일정 확인</button></div></div></div>'}
function leagueTable(){return table(['순위','구단','경기','승','무','패','승점'],divisionNames.map((n,i)=>'<tr><td class="'+(i<2?'rank-up':i>=8?'rank-down':'')+'">'+(i+1)+'</td><td class="name">'+n+'</td><td class="num">0</td><td class="num">0</td><td class="num">0</td><td class="num">0</td><td class="num">'+(i===1?'<strong>0</strong>':'0')+'</td></tr>'),true)}
function home(){return '<div class="metric-row"><div class="metric"><span>리그 순위</span><strong>— <small>/ 10</small></strong><small>시즌 개막 전</small></div><div class="metric"><span>구단 재정</span><strong>₽12.0M</strong><small>운영 자금</small></div><div class="metric"><span>등록 트레이너</span><strong>5 <small>/ 5</small></strong><small>출전 가능</small></div><div class="metric"><span>등록 포켓몬</span><strong>30 <small>/ 30</small></strong><small>선수단 전체</small></div></div><div class="layout"><div><div class="section"><div class="section-head"><h2>1군 트레이너</h2><small>등록 인원 5명</small></div>'+trainerTable()+'</div><div class="section"><div class="section-head"><h2>1부 리그</h2><button class="action" data-go="league">전체 순위</button></div>'+leagueTable()+'</div></div><div class="right-column">'+match()+detail()+'</div></div>'}
function squad(){return '<div class="layout"><div><div class="section"><div class="section-head"><h2>트레이너 명단</h2><div class="toolbar"><select id="squad-filter"><option value="all">전체 트레이너</option><option value="canonical">대표 트레이너</option><option value="original">구단 소속</option></select></div></div>'+trainerTable()+'</div><div class="footnote">행을 선택하면 우측에 트레이너의 능력치와 보유 포켓몬이 표시됩니다.</div></div><div>'+detail()+'</div></div>'}
function tactics(){
const order=state.order;const selected=state.selected;const t=trainers[selected];
const preset=['공격형 — 균형적인 압박','교체 중심 운영','상성 우선 대응','에이스 보호','안정적인 연승전'];
return '<div class="workspace-head"><strong>GAME PLAN CHOICE</strong><span class="subtle">전술 프리셋 1 / 3　　<span class="plan-flag">● 수정 사항은 이 미리보기에서만 유지됩니다</span></span></div>'+
'<div class="tactic-grid"><div class="tactic-column"><div class="tactic-label">전술 목록</div><div class="plan-list">'+preset.map((p,i)=>'<button class="plan-choice '+(state.plan===i?'selected':'')+'" data-plan="'+i+'"><span class="dot"></span>'+p+'</button>').join('')+'</div><div class="mentality"><div class="tactic-label">MENTALITY</div><label>교체 성향 (UI 시안)</label><input type="range" min="0" max="4" value="'+state.switchPref+'" disabled><div class="config-note">전투 엔진에 미연결 — 실제 선택에 영향을 주지 않습니다.</div><label>공격 / 수비 성향 (UI 시안)</label><input type="range" min="0" max="4" value="2" disabled></div></div>'+
'<div class="tactic-column"><div class="tactic-label">출전 순서　 <span class="subtle">선택해서 순서 변경</span></div><div class="formation"><div class="field-line"></div><div class="field-circle"></div>'+order.map((idx,i)=>'<button class="field-unit '+(idx===selected?'selected':'')+'" style="left:'+([50,30,70,38,62][i])+'%;top:'+([13,39,39,75,75][i])+'%" data-trainer="'+idx+'" title="'+trainers[idx].name+'">'+(i+1)+'</button>').join('')+'</div><div class="formation-caption">'+t.name+'　·　'+t.role+'</div><div class="formation-help">원형은 트레이너 5명의 출전 순서를 나타냅니다. 실제 전장 위치가 아닙니다.</div><div class="order-row"><button data-move="'+order.indexOf(selected)+':-1" '+(order.indexOf(selected)===0?'disabled':'')+'>↑ 앞 순서</button><button data-move="'+order.indexOf(selected)+':1" '+(order.indexOf(selected)===4?'disabled':'')+'>↓ 뒤 순서</button></div><div class="formation-help" style="margin-top:16px">현재 출전 순서: '+order.map(i=>trainers[i].name).join('　›　')+'</div></div>'+
'<div class="tactic-column"><div class="config-tabs"><button class="active">전술 설정</button><button disabled>고급 설정</button></div><div class="config-panel"><div class="config-group"><h3>선택 트레이너</h3><div class="config-row"><span>이름</span><strong>'+t.name+'</strong></div><div class="config-row"><span>전술 이해도</span><strong>'+value(t.tactics)+' / 20</strong></div><div class="config-row"><span>교체 판단</span><strong>'+value(t.switching)+' / 20</strong></div><div class="config-row"><span>역할</span><strong>'+t.role+'</strong></div></div><div class="config-group"><h3>실제 적용되는 설정</h3><div class="config-row"><span>출전 순서</span><div class="config-options">'+order.map((idx,i)=>'<button data-trainer="'+idx+'" class="'+(idx===selected?'active':'')+'">'+(i+1)+'</button>').join('')+'</div></div><div class="config-row"><span>일반 공격</span><div class="config-options"><button class="active">자동</button></div></div><div class="config-row"><span>기술 선택</span><div class="config-options"><button class="active">트레이너 AI</button></div></div><div class="config-row"><span>포켓몬 교체</span><div class="config-options"><button class="active">트레이너 AI</button></div></div></div><div class="config-group"><h3>추후 연결할 전술 지침</h3><div class="config-note">아래 선택지는 디자인 확인용이며 현재 전투 결과에 반영되지 않습니다.</div>'+[['공격 강도','낮음','보통','높음'],['교체 빈도','보수적','균형','적극적'],['위험 감수','낮음','보통','높음'],['상성 대응','약함','보통','강함']].map(([label,...opts])=>'<div class="config-row"><span>'+label+'</span><div class="config-options">'+opts.map((v,i)=>'<button disabled class="'+(i===1?'active':'')+'">'+v+'</button>').join('')+'</div></div>').join('')+'</div><div class="config-group"><h3>보유 포켓몬 · 6</h3><div class="config-note">'+t.pokemon.join('　·　')+'</div></div></div></div></div>';
}
function pokemon(){const t=trainers[state.selected];return '<div class="layout"><div><div class="section"><div class="section-head"><h2>보유 포켓몬</h2><select id="pokemon-trainer">'+trainers.map((x,i)=>'<option value="'+i+'" '+(i===state.selected?'selected':'')+'>'+x.name+'</option>').join('')+'</select></div>'+table(['슬롯','포켓몬','소속 트레이너','등록','비고'],t.pokemon.map((p,i)=>'<tr><td>'+String(i+1).padStart(2,'0')+'</td><td class="name">'+p+'</td><td>'+t.name+'</td><td><span class="pill">등록</span></td><td class="muted">상세 수치 연동 예정</td></tr>'))+'</div></div><div>'+detail()+'</div></div>'}
function league(){return '<div class="layout"><div><div class="section"><div class="section-head"><h2>리그 순위표</h2><select id="division">'+[1,2,3,4].map(n=>'<option value="'+n+'" '+(state.division===n?'selected':'')+'>'+n+'부 리그</option>').join('')+'</select></div>'+(state.division===1?leagueTable():'<div class="empty">'+state.division+'부 순위 데이터는 실제 경기 엔진 연결 시 표시됩니다.</div>')+'</div><div class="footnote">상위 2구단 승격 / 하위 2구단 강등 · 18라운드 홈 앤드 어웨이</div></div><div>'+match()+'</div></div>'}
function fixtures(){return '<div class="layout"><div><div class="section"><div class="section-head"><h2>경기 일정</h2><small>시즌 2026 / 27</small></div>'+Array.from({length:18},(_,i)=>'<div class="formline"><div><strong>'+String(i+1).padStart(2,'0')+'R　'+(i%2?'원정':'홈')+' · '+divisionNames[(i+2)%10]+'</strong><br><small>1부 리그 · 정규 시즌</small></div><span class="muted">예정</span></div>').join('')+'</div></div><div>'+match()+'</div></div>'}
function scouting(){return '<div class="two-col"><div class="section"><div class="section-head"><h2>지역 탐색</h2><small>스카우팅 업무</small></div><div class="empty">지역별 탐색 대상과 포획 보고서는 실제 탐색 시스템과 연결할 예정입니다.</div></div><div class="section"><div class="section-head"><h2>담당 트레이너</h2></div>'+trainers.map(t=>'<div class="formline"><strong>'+t.name+'</strong><span>탐색 '+value(t.scouting)+' / 감별 '+value(t.appraisal)+'</span></div>').join('')+'</div></div>'}
function finances(){return '<div class="metric-row"><div class="metric"><span>운영 자금</span><strong>₽12.0M</strong><small>도시 규모 지수 100</small></div><div class="metric"><span>팬 규모</span><strong>75,000</strong><small>초기 추정치</small></div><div class="metric"><span>시설 수준</span><strong>20 <small>/ 20</small></strong><small>초기 설정</small></div><div class="metric"><span>구단 규모</span><strong>대도시</strong><small>최상위 규모</small></div></div><div class="section"><div class="section-head"><h2>재정 보고</h2></div><div class="empty">구단 초기 자금은 생성 규칙에 연결된 값입니다. 수입·지출·계약 예산은 재정 엔진 연동 후 표시됩니다.</div></div>'}
const pages={home:['Club overview','구단 개요','미르시티 FC · 칼로스 지방',home],squad:['Squad','트레이너','1군 등록 명단 및 능력치',squad],tactics:['Tactics','전술 및 출전 순서','연승전 출전 순서와 트레이너 AI',tactics],pokemon:['Pokémon','포켓몬','트레이너별 등록 포켓몬',pokemon],league:['Competition','리그','4개 디비전 · 승강급 2구단',league],fixtures:['Fixtures','일정 및 결과','2026 / 27 시즌',fixtures],scouting:['Recruitment','스카우팅','지역 탐색 및 개체 감별',scouting],finances:['Finances','재정','운영 자금 및 시설 현황',finances]};
function render(){const p=pages[state.view];$('eyebrow').textContent=p[0];$('page-title').textContent=p[1];$('page-subtitle').textContent=p[2];$('breadcrumb').textContent='구단 / '+p[1];$('view').innerHTML=p[3]();document.querySelectorAll('[data-view]').forEach(el=>el.classList.toggle('active',el.dataset.view===state.view));}
document.addEventListener('click',e=>{const plan=e.target.closest('[data-plan]');if(plan){state.plan=Number(plan.dataset.plan);render();return}const nav=e.target.closest('[data-view]');if(nav){state.view=nav.dataset.view;render();return}const go=e.target.closest('[data-go]');if(go){state.view=go.dataset.go;render();return}const tr=e.target.closest('[data-trainer]');if(tr){state.selected=Number(tr.dataset.trainer);render();return}const move=e.target.closest('[data-move]');if(move){const [i,delta]=move.dataset.move.split(':').map(Number),j=i+delta;if(j>=0&&j<5){[state.order[i],state.order[j]]=[state.order[j],state.order[i]];render()}}});
document.addEventListener('change',e=>{if(e.target.id==='pokemon-trainer'){state.selected=Number(e.target.value);render()}if(e.target.id==='division'){state.division=Number(e.target.value);render()}});
$('advance').addEventListener('click',()=>{const n=$('notification');n.classList.remove('hidden');n.textContent='UI 미리보기 모드: 날짜 진행과 실제 경기 결과 반영은 게임 엔진 연결 후 활성화됩니다.';});
render();
</script></body></html>
